<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Ambient blue backing glow -->
  <circle cx="32" cy="32" r="16" fill="#2563eb" opacity="0.3" filter="url(#glow)" />

  <!-- Database Bottom Disk -->
  <path d="M19 37 C19 41.2 24.8 44.5 32 44.5 C39.2 44.5 45 41.2 45 37 V41 C45 45.2 39.2 48.5 32 48.5 C24.8 48.5 19 45.2 19 41 Z" fill="url(#primaryGrad)" opacity="0.75" />
  
  <!-- Database Middle Disk -->
  <path d="M19 28 C19 32.2 24.8 35.5 32 35.5 C39.2 35.5 45 32.2 45 28 V32 C45 36.2 39.2 39.5 32 39.5 C24.8 39.5 19 36.2 19 32 Z" fill="url(#primaryGrad)" opacity="0.9" />

  <!-- Database Top Cylinder -->
  <path d="M19 19 C19 23.2 24.8 26.5 32 26.5 C39.2 26.5 45 23.2 45 19 V23 C45 27.2 39.2 30.5 32 30.5 C24.8 30.5 19 27.2 19 23 Z" fill="url(#primaryGrad)" />
  <ellipse cx="32" cy="19" rx="13" ry="5" fill="url(#cyanGrad)" />

  <!-- AI Query Lightning Pulse Spark -->
  <path d="M34 11 L25 26.5 L32.5 26.5 L29.5 39 L40 23 L32.5 23 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
